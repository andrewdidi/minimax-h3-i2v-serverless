name: Build and push Docker image

# GHCR 始终推送（短名 minimax-h3）。
# Docker Hub 仅在 DOCKERHUB_USERNAME + DOCKERHUB_TOKEN 正确时推送；失败不阻断 GHCR。
# RunPod 请用 Hub：<user>/minimax-h3:latest（勿用旧长名 / 勿用 ghcr）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # 新短名（换名推送）
  GHCR_IMAGE: ghcr.io/andrewdidi/minimax-h3
  # 旧名保留一层，避免已有引用立刻断
  GHCR_IMAGE_LEGACY: ghcr.io/andrewdidi/minimax-h3-i2v-serverless

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub secrets (DOCKERHUB_* only)
        id: hubcheck
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          P: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          U="$(printf '%s' "${U:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          P="$(printf '%s' "${P:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          ok=false
          if [ -n "$U" ] && [ -n "$P" ] && [[ "$U" != dckr_pat_* ]] && [ "${#U}" -le 64 ] && [ "${#P}" -ge 20 ]; then
            ok=true
            echo "user=$U" >> "$GITHUB_OUTPUT"
            echo "Hub secrets look usable (user_len=${#U} pass_len=${#P})"
          else
            echo "Hub secrets missing or invalid — will push GHCR only."
            echo "Set DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (do NOT reuse AGRICARETK / DCKR_PAT_*)."
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.hubcheck.outputs.ok == 'true'
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          P: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          USER="$(printf '%s' "$U" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PASS="$(printf '%s' "$P" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "$PASS" | docker login -u "$USER" --password-stdin
          echo "Docker Hub login OK"

      - name: Docker metadata (GHCR always)
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.GHCR_IMAGE_LEGACY }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Docker metadata (Hub short name)
        id: meta_hub
        if: steps.hubcheck.outputs.ok == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.hubcheck.outputs.user }}/minimax-h3
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta_ghcr.outputs.tags }}
            ${{ steps.meta_hub.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Images" >> "$GITHUB_STEP_SUMMARY"
          echo "- GHCR: \`${{ env.GHCR_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.hubcheck.outputs.ok }}" = "true" ]; then
            echo "- Docker Hub: \`${{ steps.hubcheck.outputs.user }}/minimax-h3:latest\` ← **RunPod 用这个**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Docker Hub: skipped（请设置 Secrets \`DOCKERHUB_USERNAME\` + \`DOCKERHUB_TOKEN\`）" >> "$GITHUB_STEP_SUMMARY"
          fi
