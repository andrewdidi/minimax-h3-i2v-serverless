name: Build and push Docker image

# RunPod 从 GHCR 拉易 toomanyrequests → 双推 Docker Hub（见 DEPLOY.md）。
# Hub 登录用户名必须与签发 Token 的账号一致（常见：Hub 用户 ≠ GitHub andrewdidi）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/andrewdidi/minimax-h3-i2v-serverless

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 用户名：DOCKERHUB_USERNAME 或 AGRICARETK（勿再用写死的 andrewdidi）
      # Token：DOCKERHUB_TOKEN 或 DCKR_PAT_*
      - name: Resolve Docker Hub user
        id: hub
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME || secrets.AGRICARETK }}
          P: ${{ secrets.DOCKERHUB_TOKEN || secrets.DCKR_PAT_YJJSDO7JVVCNEXX9FAPKGAAOWRW }}
        run: |
          U="$(printf '%s' "$U" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::缺少 Hub 凭证。请设置 DOCKERHUB_USERNAME + DOCKERHUB_TOKEN（或 AGRICARETK=用户名 + DCKR_PAT_*=token）。"
            exit 1
          fi
          if [ "$U" = "andrewdidi" ]; then
            echo "::warning::登录用户名为 andrewdidi。若 Token 属于其它 Hub 账号，会 unauthorized。"
          fi
          echo "user=$U" >> "$GITHUB_OUTPUT"
          echo "Docker Hub namespace user=$U"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.hub.outputs.user }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DCKR_PAT_YJJSDO7JVVCNEXX9FAPKGAAOWRW }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ steps.hub.outputs.user }}/minimax-h3-i2v-serverless
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value={{date 'YYYYMMDD-HHmmss'}},enable={{is_default_branch}}

      - name: Build and push (slim Dockerfile → GHCR + Docker Hub)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
