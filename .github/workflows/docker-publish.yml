name: Build and push Docker image

# RunPod 拉 GHCR 易 toomanyrequests → 双推 Docker Hub（见 DEPLOY.md）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/andrewdidi/minimax-h3-i2v-serverless

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 清洗换行；校验未对调；stdin 登录（避免 malformed Authorization）
      - name: Log in to Docker Hub
        env:
          RAW_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.AGRICARETK }}
          RAW_PASS: ${{ secrets.DOCKERHUB_TOKEN || secrets.DCKR_PAT_YJJSDO7JVVCNEXX9FAPKGAAOWRW }}
        run: |
          set -euo pipefail
          USER="$(printf '%s' "${RAW_USER:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PASS="$(printf '%s' "${RAW_PASS:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          echo "hub_user_len=${#USER} hub_pass_len=${#PASS}"
          if [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::Hub 用户名或 Token 为空。请 gh secret set DOCKERHUB_USERNAME / DOCKERHUB_TOKEN"
            exit 1
          fi
          if [[ "$USER" == dckr_pat_* ]] || [[ "$USER" == DCKR_PAT_* ]]; then
            echo "::error::用户名 Secret 里像是 Token（dckr_pat_ 开头）。请把 Hub 用户名和 Token 对调重设。"
            exit 1
          fi
          if [ "${#USER}" -gt 64 ]; then
            echo "::error::用户名过长(${#USER})，多半把 Token 填进了用户名 Secret。"
            exit 1
          fi
          if [ "${#PASS}" -lt 20 ]; then
            echo "::error::Token 过短(${#PASS})。请粘贴 Docker Hub 创建 Token 时显示的完整密钥，不是 Token 的名字。"
            exit 1
          fi

          echo "$PASS" | docker login -u "$USER" --password-stdin
          echo "user=$USER" >> "$GITHUB_OUTPUT"
          echo "Docker Hub login OK as user_len=${#USER}"
        id: hub

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ steps.hub.outputs.user }}/minimax-h3-i2v-serverless
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value={{date 'YYYYMMDD-HHmmss'}},enable={{is_default_branch}}

      - name: Build and push (slim Dockerfile → GHCR + Docker Hub)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
