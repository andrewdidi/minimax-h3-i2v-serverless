name: Build and push Docker image

# RunPod 从 GHCR 拉镜像易触发 toomanyrequests（机房共享出口 IP）。
# 彻底方案：同时推 Docker Hub，Endpoint 改用 docker.io/...（见 DEPLOY.md）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/andrewdidi/minimax-h3-i2v-serverless
  # Docker Hub：RunPod Serverless 推荐镜像（需仓库 Secrets: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN）
  DH_IMAGE: andrewdidi/minimax-h3-i2v-serverless

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::缺少 GitHub Actions Secrets。请到仓库 Settings → Secrets → Actions 添加："
            echo "  DOCKERHUB_USERNAME = Docker Hub 用户名"
            echo "  DOCKERHUB_TOKEN    = Hub Access Token (Read & Write)"
            echo "当前仓库若只有其它名字的 Secret（例如误建成 AGRICARETK），Actions 读不到，会报 Username and password required。"
            echo "本机可执行: gh secret set DOCKERHUB_USERNAME && gh secret set DOCKERHUB_TOKEN"
            exit 1
          fi
          echo "Docker Hub secrets present (username length=${#DOCKERHUB_USERNAME})"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DH_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value={{date 'YYYYMMDD-HHmmss'}},enable={{is_default_branch}}

      - name: Build and push (slim Dockerfile → GHCR + Docker Hub)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
